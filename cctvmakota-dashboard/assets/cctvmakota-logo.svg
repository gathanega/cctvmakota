<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Simbol logo cctvmakota" xmlns:c2pa="http://c2pa.org/manifest">
  <title>cctvmakota — simbol</title>

  <!-- Kanvas -->
  <rect width="512" height="512" rx="104" fill="#F3F6FA"/>

  <!-- Mahkota: tiga puncak tajam, sudut presisi -->
  <path d="M112 346 V188 L184 262 L256 138 L328 262 L400 188 V346 Z" fill="#0B1F3A"/>

  <!-- Alas mahkota: trapesium miring (kesan melaju) -->
  <path d="M112 366 H400 L378 396 H134 Z" fill="#F5B301"/>

  <!-- Simpul kecerdasan di tiga puncak -->
  <circle cx="112" cy="188" r="15" fill="#F5B301"/>
  <circle cx="256" cy="138" r="15" fill="#F5B301"/>
  <circle cx="400" cy="188" r="15" fill="#F5B301"/>

  <!-- Cincin pindai: busur terbuka, berputar (kecepatan) -->
  <circle cx="256" cy="272" r="66" fill="none" stroke="#F5B301" stroke-width="6"
          stroke-dasharray="262 153" stroke-linecap="round" transform="rotate(-40 256 272)"/>

  <!-- Lensa -->
  <circle cx="256" cy="272" r="48" fill="#0B1F3A" stroke="#14C8EC" stroke-width="8"/>
  <circle cx="256" cy="272" r="20" fill="#14C8EC"/>
  <circle cx="264" cy="264" r="6" fill="#F3F6FA"/>

  <!-- Garis bidik: ketepatan -->
  <g stroke="#14C8EC" stroke-width="6">
    <line x1="168" y1="272" x2="196" y2="272"/>
    <line x1="316" y1="272" x2="344" y2="272"/>
    <line x1="256" y1="196" x2="256" y2="214"/>
    <line x1="256" y1="330" x2="256" y2="346"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
