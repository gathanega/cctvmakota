# CCTVMAKOTA - konfigurasi aktif (5 kamera sekitar UB). Bisa ditulis ulang dari Dashboard Admin > Simpan ke config.
supabase:
  url: https://xjsvtgxphbysxcwsakik.supabase.co
  service_key: ${SUPABASE_SERVICE_KEY}
admin_token: ${ADMIN_TOKEN}
timezone: Asia/Jakarta
cctv_poll_interval_seconds: 30
cctv_ffmpeg_timeout: 20
# yolo11s fine-tune CCTV Malang (~5 ms/frame); ganti ke models/yolo11x.pt bila perlu
detect:
  model: runs/yolo11s_malang_live/weights/best.pt
  imgsz: 960
  enhance: auto
  tiles: 2x3        # frame penuh + 6 potongan: kendaraan kecil/jauh ikut terdeteksi (~55 ms/frame). off = mati
  conf: 0.25
  iou: 0.65
queue_size: 1
queue_max_age_seconds: 20
queue_concurrency: 1
atcs:
  routes:
  - id: route_ns_main
    name: Koridor Utara-Selatan (Via Gajayana)
    nodes:
    - JlGajayanaArahUtaraSardo-CCTV
    - JlVeteranArahTimur-CCTV
    capacity_veh_per_hour: 1200
    baseline_traveltime_minutes: 5.0
    distance_km: 2.1
    path: []
    direction: dua_arah
    alternatives: []
  - id: route_ew_main
    name: Koridor Timur-Barat (Via Haryono)
    nodes:
    - JlMtHaryonoArahBarat-CCTV
    capacity_veh_per_hour: 1100
    baseline_traveltime_minutes: 6.0
    distance_km: 2.4
  - id: route_bypass
    name: Jalur Bypass (Via Sumber Sari)
    nodes:
    - JlSumberSariArahUtara-CCTV
    capacity_veh_per_hour: 800
    baseline_traveltime_minutes: 8.0
    distance_km: 2.8
  primary_route: route_ns_main
  activation_rules:
    vc_threshold: 0.85
    status_threshold: MACET
    objective: fastest
